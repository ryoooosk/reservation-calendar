# Dependabot のプルリクエストを自動で承認・マージする
# 対象は GitHub Actions の更新すべてと、npm のメジャー以外の更新（判定は共通ワークフロー側で行う）
name: Dependabot auto-merge

on:
  pull_request:

# 呼び出し先のジョブが承認・マージに使う権限（ここで許可しないと呼び出し先で使えない）
permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    uses: ryoooosk/reusable-workflows/.github/workflows/dependabot-auto-merge.yml@main
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
